[package]
name = "bloom-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Both edges below reach dev-dependencies, so they take effect for `cargo
# test` and are intentionally inert for `cargo build`: they exist so
# `cargo test -p bloom-broker --features triad-dev-harness` compiles the
# debug driver and the pinned signer with the same harness origin the
# broker itself serves. The signer edge only changes behaviour once the pin
# advances past the commit that introduced the developer origin.
triad-dev-harness = [
    "bloom-broker-debug-driver/triad-dev-harness",
    "bloom-triad-local-transport/triad-dev-harness",
    "bloom-signer/triad-dev-harness",
]

[dependencies]
axum.workspace = true
bloom-broker-api = { path = "../bloom-broker-api" }
bloom-signer-api.workspace = true
bloom-solana-verify.workspace = true
bloom-platform-containment.workspace = true
bloom-triad-local-transport.workspace = true
bloom-audit-checkpoint.workspace = true
bloom-service-activation.workspace = true
bloom-service-observability.workspace = true
bloom-trusted-time.workspace = true
bs58.workspace = true
config.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
num-bigint.workspace = true
parking_lot.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
bloom-broker-debug-driver = { path = "../bloom-broker-debug-driver" }
# The socket-activation regression hands a real descriptor to a child process
# between fork and exec, which needs dup2/fcntl directly.
libc = "0.2"
bloom-signer = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "d72d038cff514c3b81de0514b6ad07c134359b4b" }
bloom-signer-vectors.workspace = true
futures = "0.3"
http-body-util = "0.1"
k256.workspace = true
tempfile = "3"
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
