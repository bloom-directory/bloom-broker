[package]
name = "bloom-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
triad-dev-harness = ["bloom-triad-local-transport/triad-dev-harness"]

[dependencies]
axum.workspace = true
alloy = { version = "2.0.5", default-features = false, features = ["std", "consensus", "rlp", "k256"] }
k256.workspace = true
bloom-broker-api = { path = "../bloom-broker-api" }
bloom-signer-api.workspace = true
bloom-platform-containment.workspace = true
bloom-triad-local-transport.workspace = true
bloom-audit-checkpoint.workspace = true
bloom-service-activation.workspace = true
bloom-service-observability.workspace = true
bloom-trusted-time.workspace = true
config.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
num-bigint.workspace = true
parking_lot.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
bloom-broker-debug-driver = { path = "../bloom-broker-debug-driver" }
bloom-signer = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "0126ba4589ad8cf504d2f04c8e36471727964089" }
futures = "0.3"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
