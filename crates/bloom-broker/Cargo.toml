[package]
name = "bloom-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
triad-dev-harness = ["bloom-triad-local-transport/triad-dev-harness"]

[dependencies]
axum.workspace = true
bloom-broker-api = { path = "../bloom-broker-api" }
bloom-signer-api.workspace = true
bloom-solana.workspace = true
bloom-platform-containment.workspace = true
bloom-triad-local-transport.workspace = true
bloom-audit-checkpoint.workspace = true
bloom-service-activation.workspace = true
bloom-service-observability.workspace = true
bloom-trusted-time.workspace = true
bs58.workspace = true
config.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
num-bigint.workspace = true
parking_lot.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
bloom-broker-debug-driver = { path = "../bloom-broker-debug-driver" }
# The socket-activation regression hands a real descriptor to a child process
# between fork and exec, which needs dup2/fcntl directly.
libc = "0.2"
bloom-signer = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "7404b62ecac2a9ebd760c8f7b37deb76e1e7eeb8" }
bloom-signer-vectors.workspace = true
futures = "0.3"
http-body-util = "0.1"
k256.workspace = true
tempfile = "3"
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
