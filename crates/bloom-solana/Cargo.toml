[package]
name = "bloom-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical Solana legacy-message codec and the strict solana-system-transfer-v1 semantic verifier for Bloom verified chain Petals"

[features]
default = []

[dependencies]
sha2.workspace = true
serde.workspace = true
bs58.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
ed25519-dalek.workspace = true
solana-message = { version = "4.5.0", features = ["wincode"] }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "4.2.0", features = ["verify", "wincode"] }
