name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  privileged-w0:
    name: privileged W0 listener ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Build cross-UID canonical-listener test
        id: w0-test
        run: |
          executable="$(
            cargo test -p bloom-broker --test w0_listener_ownership \
              --locked --no-run --message-format=json |
              jq -r 'select(.profile.test == true and .target.name == "w0_listener_ownership") | .executable' |
              tail -n 1
          )"
          test -n "$executable"
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Run cross-UID canonical-listener test
        run: sudo "${{ steps.w0-test.outputs.executable }}" --nocapture
