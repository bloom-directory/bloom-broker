name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Assert Bloom product repo is absent
        run: |
          if grep -Fq 'source = "git+https://github.com/bloom-directory/bloom.git' Cargo.lock; then
            echo 'Cargo.lock must not resolve packages from the Bloom product repository' >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify bundled token artwork and source boundaries
        run: |
          python3 scripts/bundle-token-artwork.py --check
          python3 scripts/test_token_artwork.py
          python3 -B scripts/test_token_derivation.py
          python3 -B crates/bloom-broker-api/tokens/tokens.py --offline crates/bloom-broker-api/tokens/fixtures/pusd-inputs-2026-10-20.json.gz --check crates/bloom-broker-api/tokens/fixtures/pusd-derived-2026-10-20.json
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Check shared Weiroll encoder vectors
        run: python3 -B scripts/weiroll_vectors.py --check

  weiroll-encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.4.4
      - name: Check pinned encoder against shared reader vectors
        run: |
          python3 -B scripts/weiroll_vectors.py --check
          forge test --root crates/bloom-evm-clear-signing/tests/fixtures/weiroll

  released-policy-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 4885a77f7741f63aa04b131d091039716b14dffc
          path: released-policy-fixture
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show
      - name: Verify plain and legacy released stores through signing and rollback
        env:
          BLOOM_RELEASED_BROKER_FIXTURE_ROOT: ${{ github.workspace }}/released-policy-fixture
        run: bash scripts/test-released-policy-upgrade.sh

  privileged-w0:
    name: privileged W0 listener ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Build cross-UID canonical-listener test
        id: w0-test
        run: |
          executable="$(
            cargo test -p bloom-broker --test w0_listener_ownership \
              --locked --no-run --message-format=json |
              jq -r 'select(.profile.test == true and .target.name == "w0_listener_ownership") | .executable' |
              tail -n 1
          )"
          test -n "$executable"
          test -x "$executable"
          installed_executable="/tmp/bloom-w0-listener-ownership-test"
          install -m 0755 "$executable" "$installed_executable"
          echo "executable=$installed_executable" >> "$GITHUB_OUTPUT"
      - name: Run cross-UID canonical-listener test
        run: sudo "${{ steps.w0-test.outputs.executable }}" --nocapture
