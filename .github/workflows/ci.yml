name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Assert Bloom product repo is absent
        run: |
          if grep -Fq 'source = "git+https://github.com/bloom-directory/bloom.git' Cargo.lock; then
            echo 'Cargo.lock must not resolve packages from the Bloom product repository' >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Exercise isolated developer ceremony origin
        env:
          BLOOM_TRIAD_DEV_CEREMONY_PORT: "28735"
        run: |
          cargo test -p bloom-broker --test w0_ceremony_activation --locked
          cargo test -p bloom-broker --features triad-dev-harness \
            --test w0_ceremony_activation --locked
          cargo test -p bloom-broker --features triad-dev-harness \
            --test w5_ceremony --locked \
            assets_headers_host_origin_token_and_opaque_relay_are_enforced -- --exact
          cargo test -p bloom-broker --features triad-dev-harness \
            --test w5_ceremony --locked \
            prebound_canonical_listener_is_a_fatal_no_fallback_failure -- --exact
          cargo test -p bloom-broker-debug-driver --lib --locked \
            tests::production_scoped_origin_ignores_the_developer_override -- --exact
          cargo test -p bloom-broker-debug-driver --features triad-dev-harness --lib --locked \
            tests::developer_ceremony_origin_tracks_the_selected_port -- --exact --ignored

  privileged-w0:
    name: privileged W0 listener ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Build cross-UID canonical-listener test
        id: w0-test
        run: |
          executable="$(
            cargo test -p bloom-broker --test w0_listener_ownership \
              --locked --no-run --message-format=json |
              jq -r 'select(.profile.test == true and .target.name == "w0_listener_ownership") | .executable' |
              tail -n 1
          )"
          test -n "$executable"
          test -x "$executable"
          installed_executable="/tmp/bloom-w0-listener-ownership-test"
          install -m 0755 "$executable" "$installed_executable"
          echo "executable=$installed_executable" >> "$GITHUB_OUTPUT"
      - name: Run cross-UID canonical-listener test
        run: sudo "${{ steps.w0-test.outputs.executable }}" --nocapture
