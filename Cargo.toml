[workspace]
members = [
  "crates/bloom-broker-api",
  "crates/bloom-broker",
  "crates/bloom-broker-debug-driver",
  "crates/bloom-solana-verify",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
bloom-rpc-wire = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
bloom-signer-api = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "683c6f9c9b069bf24125230cd7615d44474aa8ae" }
bloom-signer-vectors = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "683c6f9c9b069bf24125230cd7615d44474aa8ae" }
bloom-solana-verify = { path = "crates/bloom-solana-verify" }
bs58 = "0.5"
bloom-triad-local-transport = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
bloom-audit-checkpoint = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
bloom-service-activation = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
bloom-service-observability = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
bloom-trusted-time = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
bloom-platform-containment = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
sha3 = "0.12"
hex = "0.4"
ed25519-dalek = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
num-bigint = "0.5"
parking_lot = "0.12"
p256 = { version = "0.14", features = ["ecdsa"] }
rand = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1"
ciborium = "0.2"
config = { version = "0.15", default-features = false, features = ["json"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
bip32 = { version = "0.5", features = ["secp256k1"] }
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
memchr = "2"
hkdf = "0.13"

# Signer pins an older runtime revision. Replace all seven packages so shared types
# come from the workspace revision. Cargo forbids same-source git [patch] entries.
[replace]
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-rpc-wire:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-triad-local-transport:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-audit-checkpoint:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-service-activation:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-service-observability:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-trusted-time:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
"https://github.com/bloom-directory/bloom-service-runtime.git#bloom-platform-containment:0.1.3" = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "5db670e1b7507deabfdcf451be8b5d315c1c9d91" }
