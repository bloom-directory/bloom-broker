[workspace]
members = [
  "crates/bloom-broker-api",
  "crates/bloom-broker",
  "crates/bloom-broker-debug-driver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
bloom-rpc-wire = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "9aa0ba9130a9fe230b0394475840cc950b3fa181" }
bloom-signer-api = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "d63011321592740bf32a8b76ad202066645cc41e" }
bloom-triad-local-transport = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "9aa0ba9130a9fe230b0394475840cc950b3fa181" }
bloom-audit-checkpoint = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "9aa0ba9130a9fe230b0394475840cc950b3fa181" }
bloom-service-activation = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "9aa0ba9130a9fe230b0394475840cc950b3fa181" }
bloom-trusted-time = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "9aa0ba9130a9fe230b0394475840cc950b3fa181" }
bloom-platform-containment = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "9aa0ba9130a9fe230b0394475840cc950b3fa181" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
num-bigint = "0.4"
parking_lot = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1"
ciborium = "0.2"
config = { version = "0.15", default-features = false, features = ["json"] }
hpke = { version = "0.11", features = ["x25519"] }
chacha20poly1305 = "0.10"
bip32 = { version = "0.5", features = ["secp256k1"] }
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
memchr = "2"
hkdf = "0.12"
