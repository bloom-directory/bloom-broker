[workspace]
members = [
  "crates/bloom-broker-api",
  "crates/bloom-broker",
  "crates/bloom-broker-debug-driver",
  "crates/bloom-solana-verify",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
bloom-rpc-wire = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
bloom-signer-api = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "2ea4a8c49636bcfbc482033b8923cd4e364c6b13" }
bloom-signer-vectors = { git = "https://github.com/bloom-directory/bloom-signer.git", rev = "2ea4a8c49636bcfbc482033b8923cd4e364c6b13" }
bloom-solana-verify = { path = "crates/bloom-solana-verify" }
bloom-relay-client = { git = "https://github.com/bloom-directory/bloom-relay.git", rev = "2dc211ff3df1374c4fc42192057a43a89b397d70" }
bloom-relay-protocol = { git = "https://github.com/bloom-directory/bloom-relay.git", rev = "2dc211ff3df1374c4fc42192057a43a89b397d70" }
bloom-relay-admin-client = { git = "https://github.com/bloom-directory/bloom-relay.git", rev = "2dc211ff3df1374c4fc42192057a43a89b397d70" }
bs58 = "0.5"
bloom-triad-local-transport = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
bloom-audit-checkpoint = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
bloom-service-activation = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
bloom-service-observability = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
bloom-trusted-time = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
bloom-platform-containment = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "a046fd6075853e8591f295983b572c6e1d65d12d" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
sha3 = "0.12"
hex = "0.4"
ed25519-dalek = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
num-bigint = "0.5"
parking_lot = "0.12"
p256 = { version = "0.14", features = ["ecdsa"] }
rand = "0.10"
rustls = "0.23"
uuid = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1"
ciborium = "0.2"
config = { version = "0.15", default-features = false, features = ["json"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
bip32 = { version = "0.5", features = ["secp256k1"] }
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
memchr = "2"
hkdf = "0.13"
instant-acme = { version = "0.8.5", features = ["rcgen"] }
futures-util = "0.3"
x509-parser = "0.18"
ureq = { version = "3.4.2", default-features = false, features = ["platform-verifier", "rustls"] }
url = "2.5"
